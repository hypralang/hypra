# Builds hypralang.dev from site/, and publishes it with GitHub Pages whenever main changes.
name: site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      urls: ${{ steps.urls.outputs.list }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - id: urls
        run: echo "list=$(grep -o '<loc>[^<]*' site/dist/sitemap.xml | cut -c6- | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
      # tells Bing and the other IndexNow search engines that the pages changed; the key file is in site/public
      - name: IndexNow
        continue-on-error: true
        env:
          URLS: ${{ needs.build.outputs.urls }}
        run: |
          body=$(jq -cn --argjson urls "$URLS" '{host: "hypralang.dev", key: "be4b3ce8cebe8200a3f195a2ac94008e", urlList: $urls}')
          curl -sS --fail-with-body -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' -d "$body" -w '%{http_code}\n'

